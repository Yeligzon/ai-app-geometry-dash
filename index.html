<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Minimalista - Titanio Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=SF+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <span class="brand-dot"></span>
                <h1>Titanium Calc</h1>
            </div>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="standard">Standard</button>
                <button class="mode-btn" data-mode="scientific">Scientific</button>
                <button class="mode-btn" data-mode="history">History</button>
            </div>
        </header>

        <main class="calculator-card">
            <!-- Pantalla -->
            <div class="display-screen">
                <div class="history-expression" id="historyExpression"></div>
                <div class="main-display" id="mainDisplay">0</div>
            </div>

            <!-- Panel Científico / Extendido -->
            <div class="keypad-grid scientific-panel hidden" id="scientificPanel">
                <button class="btn fn" data-action="sin">sin</button>
                <button class="btn fn" data-action="cos">cos</button>
                <button class="btn fn" data-action="tan">tan</button>
                <button class="btn fn" data-action="sqrt">√</button>
                <button class="btn fn" data-action="pow">x²</button>
                <button class="btn fn" data-action="log">log</button>
                <button class="btn fn" data-action="ln">ln</button>
                <button class="btn fn" data-action="pi">π</button>
                <button class="btn fn" data-action="e">e</button>
                <button class="btn fn" data-action="fact">n!</button>
            </div>

            <!-- Panel Principal -->
            <div class="keypad-grid main-panel">
                <button class="btn action" data-action="clear">AC</button>
                <button class="btn action" data-action="delete">⌫</button>
                <button class="btn op" data-action="percent">%</button>
                <button class="btn op" data-action="divide">÷</button>

                <button class="btn num" data-num="7">7</button>
                <button class="btn num" data-num="8">8</button>
                <button class="btn num" data-num="9">9</button>
                <button class="btn op" data-action="multiply">×</button>

                <button class="btn num" data-num="4">4</button>
                <button class="btn num" data-num="5">5</button>
                <button class="btn num" data-num="6">6</button>
                <button class="btn op" data-action="subtract">-</button>

                <button class="btn num" data-num="1">1</button>
                <button class="btn num" data-num="2">2</button>
                <button class="btn num" data-num="3">3</button>
                <button class="btn op" data-action="add">+</button>

                <button class="btn num span-2" data-num="0">0</button>
                <button class="btn num" data-num=".">.</button>
                <button class="btn equals" data-action="equals">=</button>
            </div>

            <!-- Panel de Historial -->
            <div class="history-panel hidden" id="historyPanel">
                <div class="history-header">
                    <h3>Recent Calculations</h3>
                    <button class="btn-clear-history" id="clearHistoryBtn">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <div class="history-empty">No calculations recorded</div>
                </div>
            </div>
        </main>
    </div>

    <script src="src/js/script.js"></script>
</body>
</html>
